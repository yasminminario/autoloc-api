
spring.application.name=autoloc-api

# SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=autoloc_db;encrypt=true;trustServerCertificate=true;integratedSecurity=true

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.fr.ece.autoloc=INFO
